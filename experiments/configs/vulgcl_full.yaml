name: vulgcl_full
description: "Full VulGCL model — all three branches"

model:
  graph:
    in_dim: 768
    hidden_dim: 256
    num_layers: 3
  image:
    hidden_dim: 256
  llm:
    hidden_dim: 256
    model_name: microsoft/codebert-base
  dropout: 0.3

training:
  epochs: 50
  batch_size: 32
  learning_rate: 2.0e-5
  weight_decay: 1.0e-4
  early_stopping_patience: 10
  seed: 42

data:
  dataset: devign           # devign | bigvul | stackoverflow
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  max_seq_len: 512

evaluation:
  metrics: [accuracy, f1, auc_roc]
  threshold: 0.5
